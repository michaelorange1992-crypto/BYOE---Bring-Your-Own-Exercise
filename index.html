        const RESISTANCE_TYPE_OPTIONS = [
            'Bodyweight', 'Bodyweight (Incline)', 'Bodyweight (Decline)', 'Incline', 'Decline',

        // Resistance types that don't require numeric weight entry
        const NO_WEIGHT_TYPES = [

            'TRX / Suspension', 'Bosu Ball', 'Swiss Ball'
        ];

        const RESISTANCE_LEVEL_OPTIONS = ['Kilogrammes (kg)', 'Pounds (lbs)'];

        const createInitialStation = (movementKey = 'core', index = 1) => ({

            movementKey: movementKey,
            exerciseName: INITIAL_EXERCISE_DATABASE[movementKey]?.[0] || 'Custom Exercise',
            customExerciseName: '',
            resistances: [
                { id: 'res_1', type: 'Bodyweight', unit: 'Kilogrammes (kg)', weight: '' }

            targetType: movementKey === 'cardio' ? 'minutes' : 'reps',
            targetValue: movementKey === 'cardio' ? '1' : '10',
            perSide: false,
            notes: ''

        function MinuteDialSelector({ value, onChange }) {
            const dialRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);

            const numVal = parseFloat(value) || 1;
            const minVal = 0.5;
            const maxVal = 20;

            const percentage = Math.min(Math.max((numVal - minVal) / (maxVal - minVal), 0), 1);
            const rotationAngle = percentage * 260 - 130;

            const calculateValFromPointer = useCallback((clientX, clientY) => {
                if (!dialRef.current) return;
                const rect = dialRef.current.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const dx = clientX - centerX;
                const dy = clientY - centerY;

                let deg = Math.atan2(dx, -dy) * (180 / Math.PI);
                if (deg < -150) deg = -130;
                if (deg > 150) deg = 130;

                const clampedDeg = Math.min(Math.max(deg, -130), 130);
                const normPercentage = (clampedDeg + 130) / 260;
                
                let calculatedVal = minVal + normPercentage * (maxVal - minVal);
                calculatedVal = Math.round(calculatedVal * 2) / 2;
                calculatedVal = Math.min(Math.max(calculatedVal, minVal), maxVal);

                onChange(String(calculatedVal));
            }, [onChange, minVal, maxVal]);

            const handlePointerDown = (e) => {
                e.preventDefault();
                setIsDragging(true);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                calculateValFromPointer(clientX, clientY);
            };

            useEffect(() => {
                if (!isDragging) return;
                const handlePointerMove = (e) => {
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    calculateValFromPointer(clientX, clientY);
                };
                const handlePointerUp = () => setIsDragging(false);

                window.addEventListener('mousemove', handlePointerMove);
                window.addEventListener('mouseup', handlePointerUp);
                window.addEventListener('touchmove', handlePointerMove, { passive: false });
                window.addEventListener('touchend', handlePointerUp);

                return () => {
                    window.removeEventListener('mousemove', handlePointerMove);
                    window.removeEventListener('mouseup', handlePointerUp);
                    window.removeEventListener('touchmove', handlePointerMove);
                    window.removeEventListener('touchend', handlePointerUp);
                };
            }, [isDragging, calculateValFromPointer]);

            const handleStep = (step) => {
                let updated = Math.round((numVal + step) * 2) / 2;
                if (updated < minVal) updated = minVal;
                if (updated > 30) updated = 30;
                onChange(String(updated));
            };

            return (
                <div className="flex flex-col items-center justify-center space-y-4 pt-1 pb-2 select-none">
                    <div 
                        ref={dialRef}
                        onMouseDown={handlePointerDown}
                        onTouchStart={handlePointerDown}
                        className={`relative w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-neutral-900 border-4 ${
                            isDragging ? 'border-orange-500 shadow-orange-950/50' : 'border-neutral-700 hover:border-neutral-600'
                        } shadow-2xl flex items-center justify-center cursor-grab active:cursor-grabbing touch-none transition-colors duration-150 overflow-hidden group`}
                    >
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90 p-2 pointer-events-none">
                            <circle cx="50%" cy="50%" r="42%" className="stroke-neutral-800" strokeWidth="10" fill="transparent" />
                            <circle
                                cx="50%" cy="50%" r="42%" className="stroke-orange-600 transition-all duration-75"
                                strokeWidth="10" fill="transparent" strokeDasharray="280"
                                strokeDashoffset={280 - percentage * 280} strokeLinecap="round"
                            />
                        </svg>

                        <div 
                            className="absolute inset-0 flex items-center justify-center transition-transform duration-75 pointer-events-none"
                            style={{ transform: `rotate(${rotationAngle}deg)` }}
                        >
                            <div className="w-full h-full relative">
                                <div className={`absolute top-2.5 left-1/2 -translate-x-1/2 w-5 h-5 sm:w-6 sm:h-6 bg-orange-500 rounded-full shadow-lg border-2 border-white transition-transform ${
                                    isDragging ? 'scale-125 bg-orange-400 ring-4 ring-orange-500/50' : 'group-hover:scale-110'
                                }`} />
                            </div>
                        </div>

                        <div className="z-10 flex flex-col items-center justify-center text-center p-3 bg-neutral-950/90 rounded-full w-32 h-32 sm:w-36 sm:h-36 border-2 border-neutral-800 shadow-inner pointer-events-none">
                            <span className="text-3xl sm:text-4xl font-black text-orange-500 leading-none tracking-tight">
                                {numVal}
                            </span>
                            <span className="text-[11px] font-bold uppercase tracking-widest text-neutral-400 mt-1">
                                {numVal === 1 ? 'Minute' : 'Minutes'}
                            </span>
                            <span className="text-[9px] text-neutral-500 mt-1 font-semibold">
                                {isDragging ? 'Dragging...' : 'Rotate Knob'}
                            </span>
                        </div>
                    </div>

                    <div className="flex items-center space-x-3 pt-1">
                        <button
                            type="button" onClick={() => handleStep(-0.5)}
                            className="w-10 h-10 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-orange-500 font-bold rounded-xl border border-neutral-600 flex items-center justify-center transition"
                            aria-label="Decrease time"
                        >
                            <Minus size={18} />
                        </button>
                        <span className="text-xs font-semibold text-neutral-400 px-2">0.5m Steps</span>
                        <button
                            type="button" onClick={() => handleStep(0.5)}
                            className="w-10 h-10 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-orange-500 font-bold rounded-xl border border-neutral-600 flex items-center justify-center transition"
                            aria-label="Increase time"
                        >
                            <Plus size={18} />
                        </button>
                    </div>
                </div>
            );
        }

        const getSavedState = (key, fallback) => {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed[key] !== undefined) return parsed[key];
                }
            } catch (e) {
                console.error('Failed to read local storage:', e);
            }
            return fallback;
        };

        function App() {
            // Navigation states: 'HOME', 'ROUNDS_SELECT', 'BUILDER', 'SUMMARY', 'CELEBRATION'
            const [screen, setScreen] = useState(() => getSavedState('screen', 'HOME'));
            const [activeStationIndex, setActiveStationIndex] = useState(() => getSavedState('activeStationIndex', 0));
            const [rounds, setRounds] = useState(() => getSavedState('rounds', 3));
            const [completedRounds, setCompletedRounds] = useState(() => getSavedState('completedRounds', {}));
            const [copied, setCopied] = useState(false);

            // Modals
            const [showSettings, setShowSettings] = useState(false);
            const [showHelp, setShowHelp] = useState(false);
            const [editingStationNotes, setEditingStationNotes] = useState(null); // Station ID for inline note edit
            const [quickEditStation, setQuickEditStation] = useState(null); // Station object for quick edit modal
            const [showCustomExModal, setShowCustomExModal] = useState(null); // Movement key if adding custom exercise

            // Custom and Hidden Exercises Store
            const [exerciseDb, setExerciseDb] = useState(() => getSavedState('exerciseDb', INITIAL_EXERCISE_DATABASE));
            const [hiddenExercises, setHiddenExercises] = useState(() => getSavedState('hiddenExercises', {}));
            const [newCustomExName, setNewCustomExName] = useState('');

            // Workout Stations List
            const [stations, setStations] = useState(() => getSavedState('stations', [
                createInitialStation('core', 1),
                createInitialStation('cardio', 2),
                createInitialStation('push', 3),
                createInitialStation('pull', 4),
                createInitialStation('legs', 5)
            ]));

            // Drag reorder
            const [draggedIdx, setDraggedIdx] = useState(null);
            const touchStartIndex = useRef(null);

            // Touch Swipe handling for Builder steps
            const touchSwipeStartX = useRef(null);

            useEffect(() => {
                try {
                    const stateToSave = { screen, activeStationIndex, rounds, completedRounds, stations, exerciseDb, hiddenExercises };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToSave));
                } catch (e) {
                    console.error('Failed to save state:', e);
                }
            }, [screen, activeStationIndex, rounds, completedRounds, stations, exerciseDb, hiddenExercises]);

            // --- Navigation Handlers ---
            const handleGoToRounds = () => setScreen('ROUNDS_SELECT');
            const handleStartBuilding = () => { setActiveStationIndex(0); setScreen('BUILDER'); };
            const handleFinishBuilding = () => setScreen('SUMMARY');
            const handleCompleteWorkout = () => setScreen('CELEBRATION');
            const handleResetAll = () => {
                setScreen('HOME');
                setActiveStationIndex(0);
                setCompletedRounds({});
            };

            // --- Station Helpers ---
            const currentStation = stations[activeStationIndex] || stations[0];

            const updateStation = (id, fields) => {
                setStations(prev => prev.map(st => st.id === id ? { ...st, ...fields } : st));
            };

            const addStation = () => {
                const newSt = createInitialStation('core', stations.length + 1);
                setStations(prev => [...prev, newSt]);
                setActiveStationIndex(stations.length);
            };

            const removeStation = (id) => {
                if (stations.length <= 1) return;
                setStations(prev => prev.filter(st => st.id !== id));
                if (activeStationIndex >= stations.length - 1) {
                    setActiveStationIndex(Math.max(0, stations.length - 2));
                }
            };

            const moveStation = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= stations.length) return;
                const newStations = [...stations];
                const [movedItem] = newStations.splice(index, 1);
                newStations.splice(targetIndex, 0, movedItem);
                setStations(newStations);
            };

            // --- Resistance Handlers ---
            const addResistanceToStation = (stationId) => {
                setStations(prev => prev.map(st => {
                    if (st.id === stationId) {
                        const newRes = { id: 'res_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), type: 'Dumbbell', unit: 'Kilogrammes (kg)', weight: '' };
                        return { ...st, resistances: [...st.resistances, newRes] };
                    }
                    return st;
                }));
            };

            const updateResistanceInStation = (stationId, resId, field, value) => {
                setStations(prev => prev.map(st => {
                    if (st.id === stationId) {
                        const updatedRes = st.resistances.map(r => r.id === resId ? { ...r, [field]: value } : r);
                        return { ...st, resistances: updatedRes };
                    }
                    return st;
                }));
            };

            const removeResistanceFromStation = (stationId, resId) => {
                setStations(prev => prev.map(st => {
                    if (st.id === stationId && st.resistances.length > 1) {
                        return { ...st, resistances: st.resistances.filter(r => r.id !== resId) };
                    }
                    return st;
                }));
            };

            // --- Exercise Database Management ---
            const handleAddCustomExercise = (movementKey) => {
                if (!newCustomExName.trim()) return;
                const cleanName = newCustomExName.trim();
                setExerciseDb(prev => ({
                    ...prev,
                    [movementKey]: [...(prev[movementKey] || []), cleanName]
                }));
                if (currentStation) {
                    updateStation(currentStation.id, { exerciseName: cleanName });
                }
                setNewCustomExName('');
                setShowCustomExModal(null);
            };

            const toggleHideExercise = (movementKey, exName) => {
                setHiddenExercises(prev => {
                    const categoryHidden = prev[movementKey] || [];
                    const isHidden = categoryHidden.includes(exName);
                    const updatedCategory = isHidden 
                        ? categoryHidden.filter(n => n !== exName)
                        : [...categoryHidden, exName];
                    return { ...prev, [movementKey]: updatedCategory };
                });
            };

            // --- Swipe Navigation for Builder ---
            const handleBuilderTouchStart = (e) => { touchSwipeStartX.current = e.touches[0].clientX; };
            const handleBuilderTouchEnd = (e) => {
                if (touchSwipeStartX.current === null) return;
                const touchEndX = e.changedTouches[0].clientX;
                const diffX = touchSwipeStartX.current - touchEndX;
                if (Math.abs(diffX) > 60) {
                    if (diffX > 0 && activeStationIndex < stations.length - 1) {
                        setActiveStationIndex(prev => prev + 1);
                    } else if (diffX < 0 && activeStationIndex > 0) {
                        setActiveStationIndex(prev => prev - 1);
                    }
                }
                touchSwipeStartX.current = null;
            };

            // --- Summary Drag and Drop ---
            const handleDragStart = (e, index) => { setDraggedIdx(index); e.dataTransfer.effectAllowed = 'move'; };
            const handleDragOver = (e) => e.preventDefault();
            const handleDrop = (e, dropIndex) => {
                e.preventDefault();
                if (draggedIdx === null || draggedIdx === dropIndex) return;
                const newStations = [...stations];
                const [movedItem] = newStations.splice(draggedIdx, 1);
                newStations.splice(dropIndex, 0, movedItem);
                setStations(newStations);
                setDraggedIdx(null);
            };

            const handleTouchStart = (e, index) => { touchStartIndex.current = index; setDraggedIdx(index); };
            const handleTouchMove = (e) => {
                if (touchStartIndex.current === null) return;
                const touchY = e.touches[0].clientY;
                const targetEl = document.elementFromPoint(e.touches[0].clientX, touchY);
                if (!targetEl) return;
                const cardEl = targetEl.closest('[data-station-index]');
                if (cardEl) {
                    const overIndex = parseInt(cardEl.getAttribute('data-station-index'), 10);
                    if (!isNaN(overIndex) && overIndex !== touchStartIndex.current) {
                        const newStations = [...stations];
                        const [movedItem] = newStations.splice(touchStartIndex.current, 1);
                        newStations.splice(overIndex, 0, movedItem);
                        setStations(newStations);
                        touchStartIndex.current = overIndex;
                        setDraggedIdx(overIndex);
                    }
                }
            };
            const handleTouchEnd = () => { touchStartIndex.current = null; setDraggedIdx(null); };

            // --- Copy & Print Exports ---
            const generateWorkoutText = () => {
                let text = `CIRCUIT WORKOUT SUMMARY (${rounds} ${rounds === 1 ? 'Round' : 'Rounds'})\n==========================================\n\n`;
                stations.forEach((st, index) => {
                    const movObj = MOVEMENT_TYPES.find(m => m.key === st.movementKey) || { title: st.movementKey };
                    const name = st.exerciseName === 'Custom Exercise' && st.customExerciseName ? st.customExerciseName : st.exerciseName;
                    const isMins = st.targetType === 'minutes';
                    const perSideText = st.perSide ? ' (per side)' : '';
                    const targetText = isMins ? `${st.targetValue} ${st.targetValue === '1' ? 'min' : 'mins'}${perSideText}` : `${st.targetValue} reps${perSideText}`;
                    
                    const resDetails = st.resistances.map(r => {
                        const isWeightless = NO_WEIGHT_TYPES.includes(r.type);
                        const weightStr = (!isWeightless && r.weight) ? ` (${r.weight} ${r.unit.includes('kg') ? 'kg' : 'lbs'})` : '';
                        return `${r.type}${weightStr}`;
                    }).join(' + ');

                    text += `${index + 1}. ${movObj.title.toUpperCase()}: ${name}\n   Target: ${targetText}\n   Equipment: ${resDetails || 'Bodyweight'}\n`;
                    if (st.notes) text += `   Notes: ${st.notes}\n`;
                    text += `\n`;
                });
                return text;
            };

            const handleCopySummary = () => {
                const text = generateWorkoutText();
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 2000); });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            const handlePrintSummary = () => { window.print(); };

            // ================= SCREENS =================

            // 1. HOME SCREEN
            const renderHomeScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[80vh] text-center px-4 relative">
                    <div className="absolute top-0 right-0 flex items-center space-x-2">
                        <button onClick={() => setShowHelp(true)} className="p-3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-2xl border border-neutral-700 transition" title="Help & Info">
                            <HelpCircle size={22} />
                        </button>
                        <button onClick={() => setShowSettings(true)} className="p-3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-2xl border border-neutral-700 transition" title="Settings">
                            <Settings size={22} />
                        </button>
                    </div>

                    <div className="w-24 h-24 bg-orange-600/10 rounded-3xl border-2 border-orange-600/30 flex items-center justify-center mb-6 text-orange-500 shadow-2xl shadow-orange-950/40">
                        <Dumbbell size={48} />
                    </div>

                    <h1 className="text-4xl sm:text-5xl font-black text-neutral-100 mb-3 tracking-tight">Circuit Builder</h1>
                    <p className="text-neutral-400 text-base sm:text-lg max-w-sm mb-12">Design custom functional circuit workouts in seconds.</p>

                    <button onClick={handleGoToRounds} className="w-full max-w-xs bg-orange-600 hover:bg-orange-500 text-white font-black text-xl py-5 px-8 rounded-2xl shadow-2xl shadow-orange-950/50 flex items-center justify-center space-x-3 transition active:scale-95 cursor-pointer border border-orange-500/50">
                        <span>Build Workout</span>
                        <ChevronRight size={24} />
                    </button>
                </div>

            // 2. ROUNDS SELECTOR SCREEN
            const renderRoundsScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[75vh] text-center px-4">
                    <h2 className="text-3xl font-extrabold text-neutral-100 mb-2">How many rounds?</h2>
                    <p className="text-neutral-400 text-sm mb-8">Choose how many times you will complete the circuit.</p>

                    <div className="w-full max-w-xs bg-neutral-800/80 border border-neutral-700/80 rounded-2xl p-6 shadow-2xl mb-8 backdrop-blur-sm">
                        <div className="flex items-center justify-center space-x-4">
                            <button onClick={() => setRounds(prev => Math.max(1, prev - 1))} className="w-12 h-12 bg-neutral-700 hover:bg-neutral-600 text-neutral-100 rounded-xl font-bold text-2xl border border-neutral-600 flex items-center justify-center active:scale-95 transition">-</button>
                            <div className="w-28 bg-neutral-900 border-2 border-orange-600 rounded-xl py-3 flex flex-col items-center justify-center shadow-inner">
                                <span className="text-4xl font-black text-orange-500">{rounds}</span>
                                <span className="text-[10px] font-semibold text-neutral-400 uppercase tracking-wider mt-1">{rounds === 1 ? 'Round' : 'Rounds'}</span>
                            </div>
                            <button onClick={() => setRounds(prev => Math.min(30, prev + 1))} className="w-12 h-12 bg-neutral-700 hover:bg-neutral-600 text-neutral-100 rounded-xl font-bold text-2xl border border-neutral-600 flex items-center justify-center active:scale-95 transition">+</button>
                        </div>
                    </div>

                    <div className="flex items-center space-x-3 w-full max-w-xs">
                        <button onClick={() => setScreen('HOME')} className="px-5 py-4 bg-neutral-800 text-neutral-300 font-semibold text-base rounded-2xl border border-neutral-700">Back</button>
                        <button onClick={handleStartBuilding} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-bold text-lg py-4 px-6 rounded-2xl shadow-xl flex items-center justify-center space-x-2 cursor-pointer border border-orange-500/50">
                            <span>Start Building</span>
                            <ChevronRight size={20} />
                        </button>
                    </div>
                </div>
            );

            // 3. BUILDER SCREEN (STEPS)
            const renderBuilderScreen = () => {
                if (!currentStation) return null;
                const movObj = MOVEMENT_TYPES.find(m => m.key === currentStation.movementKey) || MOVEMENT_TYPES[0];
                const rawExercises = exerciseDb[currentStation.movementKey] || [];
                const hiddenList = hiddenExercises[currentStation.movementKey] || [];
                const availableExercises = rawExercises.filter(ex => !hiddenList.includes(ex));
                const isCustomName = currentStation.exerciseName === 'Custom Exercise';

                return (
                    <div className="max-w-xl mx-auto py-2 px-1" onTouchStart={handleBuilderTouchStart} onTouchEnd={handleBuilderTouchEnd}>
                        {/* Step Navigation Header */}
                        <div className="flex items-center justify-between mb-6 pb-4 border-b border-neutral-800">
                            <div>
                                <span className="text-xs font-bold uppercase tracking-wider text-orange-500 block">
                                    Station {activeStationIndex + 1} of {stations.length}
                                </span>
                                <h2 className="text-2xl font-black text-neutral-100 tracking-tight">Configure Exercise</h2>
                            </div>
                            <span className="text-xs text-neutral-400 bg-neutral-800 px-3 py-1.5 rounded-full border border-neutral-700 hidden sm:inline">
                                Swipe left / right to navigate
                            </span>

                        {/* Station Card Form */}
                        <div className="space-y-5 bg-neutral-800/70 p-5 sm:p-6 rounded-2xl border border-neutral-700/80 shadow-2xl backdrop-blur-sm relative">
                            {/* Station Action Toolbar */}
                            <div className="flex items-center justify-between border-b border-neutral-700/60 pb-3">
                                <div className="flex-grow mr-3">
                                    <label className="block text-xs font-bold uppercase tracking-wider text-neutral-400 mb-1">Movement Type</label>
                                    <select
                                        value={currentStation.movementKey}
                                        onChange={(e) => {
                                            const newKey = e.target.value;
                                            const defaultEx = (exerciseDb[newKey] || [])[0] || 'Custom Exercise';
                                            updateStation(currentStation.id, { movementKey: newKey, exerciseName: defaultEx });
                                        }}
                                        className="w-full bg-neutral-900 border-2 border-orange-600/70 text-orange-400 font-bold text-sm rounded-xl p-2.5 focus:outline-none"
                                    >
                                        {MOVEMENT_TYPES.map(m => <option key={m.key} value={m.key}>{m.title}</option>)}
                                    </select>
                                </div>
                                {stations.length > 1 && (
                                    <button onClick={() => removeStation(currentStation.id)} className="p-2.5 bg-neutral-900 hover:bg-red-950/80 text-red-400 rounded-xl border border-neutral-700 self-end" title="Delete Exercise Card">
                                        <Trash2 size={18} />
                                    </button>
                                )}
                            </div>

                            {/* Select Exercise */}
                            <div>
                                <div className="flex items-center justify-between mb-2">
                                    <label className="block text-sm font-semibold text-neutral-200">Select Exercise</label>
                                    <button onClick={() => setShowCustomExModal(currentStation.movementKey)} className="text-xs text-orange-400 hover:text-orange-300 font-bold flex items-center space-x-1">
                                        <Plus size={14} /><span>Add Custom Move</span>
                                    </button>
                                </div>
                                <select
                                    value={currentStation.exerciseName}
                                    onChange={(e) => updateStation(currentStation.id, { exerciseName: e.target.value })}
                                    className="w-full bg-neutral-900 border-2 border-neutral-700 text-neutral-100 text-base rounded-xl p-3.5 focus:border-orange-500 focus:outline-none"
                                >
                                    {availableExercises.map(ex => <option key={ex} value={ex}>{ex}</option>)}
                                    <option value="Custom Exercise">Custom Exercise...</option>
                                </select>
                                {isCustomName && (
                                    <input
                                        type="text"
                                        placeholder="Enter custom exercise name"
                                        value={currentStation.customExerciseName}
                                        onChange={(e) => updateStation(currentStation.id, { customExerciseName: e.target.value })}
                                        className="w-full mt-3 bg-neutral-900 border-2 border-orange-600/60 text-neutral-100 text-sm rounded-xl p-3 focus:border-orange-500 focus:outline-none"
                                    />
                                )}
                            </div>

                            {/* Stacked Resistances Section */}
                            <div className="space-y-3">
                                <div className="flex items-center justify-between">
                                    <label className="block text-sm font-semibold text-neutral-200">Type of Resistance</label>
                                    <button onClick={() => addResistanceToStation(currentStation.id)} className="text-xs bg-orange-950/80 text-orange-400 border border-orange-800/60 hover:bg-orange-900 px-2.5 py-1 rounded-lg font-bold flex items-center space-x-1">
                                        <Plus size={14} /><span>Add Resistance</span>
                                    </button>
                                </div>

                                {currentStation.resistances.map((res, rIdx) => {
                                    const isWeightless = NO_WEIGHT_TYPES.includes(res.type);
                                    return (
                                        <div key={res.id} className="p-3 bg-neutral-900/90 rounded-xl border border-neutral-700/80 space-y-3 relative">
                                            <div className="flex items-center space-x-2">
                                                <select
                                                    value={res.type}
                                                    onChange={(e) => updateResistanceInStation(currentStation.id, res.id, 'type', e.target.value)}
                                                    className="flex-grow bg-neutral-950 border border-neutral-700 text-neutral-100 text-sm rounded-lg p-2.5 focus:border-orange-500 focus:outline-none"
                                                >
                                                    {RESISTANCE_TYPE_OPTIONS.map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                                {currentStation.resistances.length > 1 && (
                                                    <button onClick={() => removeResistanceFromStation(currentStation.id, res.id)} className="p-2 text-neutral-400 hover:text-red-400">
                                                        <X size={16} />
                                                    </button>
                                                )}
                                            </div>

                                            {!isWeightless && (
                                                <div className="grid grid-cols-2 gap-2 pt-1 border-t border-neutral-800">
                                                    <div>
                                                        <label className="block text-[11px] text-neutral-400 mb-1">Unit</label>
                                                        <select
                                                            value={res.unit}
                                                            onChange={(e) => updateResistanceInStation(currentStation.id, res.id, 'unit', e.target.value)}
                                                            className="w-full bg-neutral-950 border border-neutral-700 text-neutral-100 text-xs rounded-lg p-2 focus:border-orange-500 focus:outline-none"
                                                        >
                                                            {RESISTANCE_LEVEL_OPTIONS.map(u => <option key={u} value={u}>{u}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-[11px] text-neutral-400 mb-1">Weight / Amount</label>
                                                        <input
                                                            type="number"
                                                            placeholder="e.g. 12.5"
                                                            value={res.weight}
                                                            onChange={(e) => updateResistanceInStation(currentStation.id, res.id, 'weight', e.target.value)}
                                                            className="w-full bg-neutral-950 border border-neutral-700 text-neutral-100 text-xs rounded-lg p-2 focus:border-orange-500 focus:outline-none"
                                                            min="0" step="0.5"
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Target Metric */}
                            <div>
                                <label className="block text-sm font-semibold text-neutral-200 mb-2">Target Metric</label>
                                <div className="grid grid-cols-2 gap-2 p-1 bg-neutral-900 rounded-xl border border-neutral-700 mb-4">
                                    <button
                                        type="button"
                                        onClick={() => { updateStation(currentStation.id, { targetType: 'reps', targetValue: '10' }); }}
                                        className={`py-2 px-3 rounded-lg text-sm font-bold flex items-center justify-center space-x-1.5 ${currentStation.targetType === 'reps' ? 'bg-orange-600 text-white shadow-md' : 'text-neutral-400'}`}
                                    >
                                        <Dumbbell size={16} /><span>Reps</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => { updateStation(currentStation.id, { targetType: 'minutes', targetValue: '1' }); }}
                                        className={`py-2 px-3 rounded-lg text-sm font-bold flex items-center justify-center space-x-1.5 ${currentStation.targetType === 'minutes' ? 'bg-orange-600 text-white shadow-md' : 'text-neutral-400'}`}
                                    >
                                        <Clock size={16} /><span>Minutes</span>
                                    </button>
                                </div>

                                {currentStation.targetType === 'reps' ? (
                                    <div className="flex items-center justify-center space-x-3 bg-neutral-900 p-3.5 rounded-xl border-2 border-neutral-700">
                                        <button type="button" onClick={() => { const val = Math.max(1, (parseInt(currentStation.targetValue, 10) || 10) - 1); updateStation(currentStation.id, { targetValue: String(val) }); }} className="w-11 h-11 bg-neutral-800 hover:bg-neutral-700 text-orange-500 font-bold text-2xl rounded-xl border border-neutral-600 flex items-center justify-center">-</button>
                                        <div className="flex-grow max-w-[170px] text-center">
                                            <input type="number" value={currentStation.targetValue} onChange={(e) => updateStation(currentStation.id, { targetValue: e.target.value })} min="1" max="500" className="w-full text-center bg-neutral-950 border-2 border-orange-600 text-orange-500 font-black text-2xl py-1.5 rounded-xl focus:outline-none" />

                                <button onClick={() => activeStationIndex > 0 ? setActiveStationIndex(prev => prev - 1) : setScreen('ROUNDS_SELECT')} className="flex items-center space-x-1 px-5 py-3.5 bg-neutral-800 text-neutral-300 font-semibold text-sm rounded-xl border border-neutral-700">

                        </div>
                    </div>

                    {/* Station Cards */}
                    <div className="space-y-3 mb-8">
                        {stations.map((st, index) => {
                            const movObj = MOVEMENT_TYPES.find(m => m.key === st.movementKey) || { title: st.movementKey };
                            const name = st.exerciseName === 'Custom Exercise' && st.customExerciseName ? st.customExerciseName : st.exerciseName;
                            const isMins = st.targetType === 'minutes';
                            const perSideText = st.perSide ? ' / side' : '';
                            const targetText = isMins ? `${st.targetValue} ${st.targetValue === '1' ? 'min' : 'mins'}${perSideText}` : `${st.targetValue} reps${perSideText}`;

                            const resistanceBadges = st.resistances.map(r => {
                                const isWeightless = NO_WEIGHT_TYPES.includes(r.type);
                                const weightStr = (!isWeightless && r.weight) ? ` (${r.weight}${r.unit.includes('kg') ? 'kg' : 'lbs'})` : '';
                                return `${r.type}${weightStr}`;
                            });

                            return (
                                <div key={st.id} data-station-index={index} draggable onDragStart={(e) => handleDragStart(e, index)} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, index)} className={`bg-neutral-800/90 border rounded-2xl p-4 sm:p-5 shadow-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 ${draggedIdx === index ? 'opacity-40 border-dashed border-orange-500' : 'border-neutral-700/80'}`}>
                                    <div className="flex items-start space-x-3 w-full sm:w-auto">
                                        <div className="flex flex-col items-center justify-center space-y-1 pr-1 text-neutral-500 self-center">
                                            <button type="button" onClick={() => moveStation(index, -1)} disabled={index === 0} className="p-1 hover:text-orange-400 disabled:opacity-20"><ArrowUp size={14} /></button>
                                            <div onTouchStart={(e) => handleTouchStart(e, index)} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} className="cursor-grab p-1 hover:text-orange-400 touch-none"><GripVertical size={18} /></div>
                                            <button type="button" onClick={() => moveStation(index, 1)} disabled={index === stations.length - 1} className="p-1 hover:text-orange-400 disabled:opacity-20"><ArrowDown size={14} /></button>
                                        </div>
                                        <div className="w-9 h-9 rounded-xl bg-orange-600/20 border border-orange-600/30 text-orange-500 flex items-center justify-center font-black text-sm flex-shrink-0 mt-0.5">{index + 1}</div>
                                        <div className="flex-grow">
                                            <div className="flex items-center space-x-2 flex-wrap gap-1">
                                                <span className="text-[11px] font-bold uppercase text-orange-500 bg-orange-950/60 px-2 py-0.5 rounded border border-orange-800/50">{movObj.title}</span>
                                                {resistanceBadges.map((badge, bIdx) => (
                                                    <span key={bIdx} className="text-[11px] text-neutral-300 bg-neutral-900 px-2 py-0.5 rounded border border-neutral-700">{badge}</span>
                                                ))}
                                                {st.perSide && <span className="text-[11px] font-bold text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50">Per Side</span>}
                                            </div>

                                            <div className="flex items-center space-x-2 mt-1">
                                                <h3 className="text-xl font-extrabold text-neutral-100">{name}</h3>
                                                <button onClick={() => setQuickEditStation(st)} className="text-neutral-500 hover:text-orange-400 p-1" title="Quick Edit Exercise">
                                                    <Edit3 size={16} />
                                                </button>
                                            </div>

                                            {/* Mid-workout note area */}
                                            {editingStationNotes === st.id ? (
                                                <div className="mt-2 flex items-center space-x-2">
                                                    <input
                                                        type="text"
                                                        value={st.notes}
                                                        onChange={(e) => updateStation(st.id, { notes: e.target.value })}
                                                        placeholder="Add mid-workout note..."
                                                        className="bg-neutral-950 border border-orange-600 text-xs text-neutral-100 rounded-lg p-2 flex-grow focus:outline-none"
                                                    />
                                                    <button onClick={() => setEditingStationNotes(null)} className="p-1.5 bg-orange-600 text-white rounded-lg text-xs font-bold">Done</button>
                                                </div>
                                            ) : (
                                                <p onClick={() => setEditingStationNotes(st.id)} className="text-xs text-neutral-400 mt-1 italic cursor-pointer hover:text-orange-300">
                                                    <span>Note: </span>
                                                    <span className="text-neutral-300">{st.notes || 'Tap to add mid-workout note...'}</span>
                                                </p>
                                            )}
                                        </div>
                                    </div>

                                    <div className="w-full sm:w-auto flex sm:flex-col items-center sm:items-end justify-between border-t sm:border-t-0 border-neutral-700/60 pt-2 sm:pt-0">
                                        <div className="bg-neutral-900 border-2 border-orange-600/80 px-4 py-2 rounded-xl text-center"><span className="text-lg font-black text-orange-500 block">{targetText}</span></div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="flex items-center justify-between pb-8 space-x-3">
                        <button onClick={() => { setActiveStationIndex(0); setScreen('BUILDER'); }} className="flex items-center space-x-2 px-5 py-3.5 bg-neutral-800 text-neutral-200 font-bold text-sm rounded-xl border border-neutral-700">
                            <Edit3 size={16} /><span>Edit Circuit</span>
                        </button>

                        <button onClick={handleCompleteWorkout} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-base py-3.5 px-6 rounded-xl shadow-xl flex items-center justify-center space-x-2 border border-emerald-500/50">
                            <Trophy size={20} /><span>Complete Workout</span>
                        </button>
                    </div>
                </div>
            );

            // 5. WORKOUT CELEBRATION SCREEN
            const renderCelebrationScreen = () => (
                <div className="flex flex-col items-center justify-center min-h-[75vh] text-center px-4 py-6">
                    <div className="w-24 h-24 bg-emerald-600/20 border-2 border-emerald-500/50 rounded-full flex items-center justify-center text-emerald-400 mb-6 shadow-2xl animate-bounce">
                        <Trophy size={48} />
                    </div>

                    <span className="text-xs font-black uppercase tracking-widest text-emerald-400 block mb-1">Workout Complete</span>
                    <h2 className="text-4xl sm:text-5xl font-black text-neutral-100 mb-2">Great Job!</h2>
                    <p className="text-neutral-400 text-base max-w-md mb-8">You successfully finished all {rounds} rounds of your custom circuit session.</p>

                    <div className="flex items-center justify-center space-x-3 mb-10 w-full max-w-sm">
                        <button onClick={handleCopySummary} className="flex-1 flex items-center justify-center space-x-2 px-4 py-3.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-100 font-bold text-sm rounded-2xl border border-neutral-700 transition">
                            {copied ? <Check size={18} className="text-emerald-400" /> : <Copy size={18} />}
                            <span>{copied ? 'Copied Summary!' : 'Copy Summary'}</span>
                        </button>
                        <button onClick={handlePrintSummary} className="flex-1 flex items-center justify-center space-x-2 px-4 py-3.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-100 font-bold text-sm rounded-2xl border border-neutral-700 transition">
                            <Printer size={18} />
                            <span>Print / PDF</span>
                        </button>
                    </div>

                    <button onClick={handleResetAll} className="w-full max-w-xs bg-orange-600 hover:bg-orange-500 text-white font-black text-lg py-4 px-8 rounded-2xl shadow-xl flex items-center justify-center space-x-2 border border-orange-500/50">
                        <RotateCcw size={20} /><span>Start New Workout</span>
                    </button>
                </div>
            );

            // --- MODALS ---
            const renderModals = () => (
                <>
                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-neutral-800 border border-neutral-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div className="flex items-center justify-between border-b border-neutral-700 pb-3">
                                    <h3 className="text-xl font-bold text-neutral-100 flex items-center space-x-2"><Settings size={20} className="text-orange-500" /><span>Settings</span></h3>
                                    <button onClick={() => setShowSettings(false)} className="text-neutral-400 hover:text-white"><X size={20} /></button>
                                </div>
                                <div className="space-y-3 text-sm text-neutral-300">
                                    <p>App Data & Preferences are automatically stored locally on your device.</p>
                                    <button onClick={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }} className="w-full py-2.5 bg-red-950/80 hover:bg-red-900 text-red-300 font-bold rounded-xl border border-red-800/50">Reset All Stored App Data</button>
                                </div>
                                <button onClick={() => setShowSettings(false)} className="w-full py-2.5 bg-neutral-700 text-white font-bold rounded-xl">Close</button>
                            </div>
                        </div>
                    )}

                    {/* Help Modal */}
                    {showHelp && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-neutral-800 border border-neutral-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <div className="flex items-center justify-between border-b border-neutral-700 pb-3">
                                    <h3 className="text-xl font-bold text-neutral-100 flex items-center space-x-2"><HelpCircle size={20} className="text-orange-500" /><span>Help & Guide</span></h3>
                                    <button onClick={() => setShowHelp(false)} className="text-neutral-400 hover:text-white"><X size={20} /></button>
                                </div>
                                <div className="space-y-2 text-xs sm:text-sm text-neutral-300">
                                    <p>1. Tap <strong>Build Workout</strong> and select total circuit rounds.</p>
                                    <p>2. Customize exercises, stacked resistances, targets, and notes for each station.</p>
                                    <p>3. Swipe left/right or tap <strong>Add Another Exercise Card</strong> to expand your workout.</p>
                                    <p>4. Refer to the Summary screen mid-workout, check off completed rounds, or make quick edits on the fly.</p>
                                </div>
                                <button onClick={() => setShowHelp(false)} className="w-full py-2.5 bg-neutral-700 text-white font-bold rounded-xl">Got It</button>
                            </div>
                        </div>
                    )}

                    {/* Add Custom Exercise Modal */}
                    {showCustomExModal && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-neutral-800 border border-neutral-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-neutral-100">Add Custom Exercise</h3>
                                <input
                                    type="text"
                                    placeholder="Exercise Name (e.g. Weighted Pistol Squats)"
                                    value={newCustomExName}
                                    onChange={(e) => setNewCustomExName(e.target.value)}
                                    className="w-full bg-neutral-900 border-2 border-orange-600 text-neutral-100 text-sm rounded-xl p-3 focus:outline-none"
                                />
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={() => setShowCustomExModal(null)} className="flex-1 py-2.5 bg-neutral-700 text-neutral-300 font-bold rounded-xl">Cancel</button>
                                    <button onClick={() => handleAddCustomExercise(showCustomExModal)} className="flex-1 py-2.5 bg-orange-600 text-white font-bold rounded-xl">Save Move</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Quick Edit Station Modal */}
                    {quickEditStation && (
                        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-neutral-800 border border-neutral-700 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex items-center justify-between border-b border-neutral-700 pb-2">
                                    <h3 className="text-lg font-bold text-neutral-100">Quick Edit Station</h3>
                                    <button onClick={() => setQuickEditStation(null)} className="text-neutral-400 hover:text-white"><X size={20} /></button>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase text-neutral-400 mb-1">Target Value</label>
                                    <input
                                        type="number"
                                        value={quickEditStation.targetValue}
                                        onChange={(e) => {
                                            const val = e.target.value;
                                            setQuickEditStation(prev => ({ ...prev, targetValue: val }));
                                            updateStation(quickEditStation.id, { targetValue: val });
                                        }}
                                        className="w-full bg-neutral-900 border border-orange-600 text-orange-400 font-black text-xl p-3 rounded-xl text-center"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase text-neutral-400 mb-1">Notes</label>
                                    <textarea
                                        rows={2}
                                        value={quickEditStation.notes}
                                        onChange={(e) => {
                                            const val = e.target.value;
                                            setQuickEditStation(prev => ({ ...prev, notes: val }));
                                            updateStation(quickEditStation.id, { notes: val });
                                        }}
                                        className="w-full bg-neutral-900 border border-neutral-700 text-neutral-100 text-sm p-3 rounded-xl resize-none"
                                    ></textarea>
                                </div>
                                <button onClick={() => setQuickEditStation(null)} className="w-full py-3 bg-orange-600 text-white font-bold rounded-xl">Done</button>
                            </div>
                        </div>
                    )}
                </>
            );

            return (
                <div className="min-h-screen bg-neutral-900 text-neutral-100 font-sans flex flex-col justify-between">
                    <header className="bg-neutral-950/80 border-b border-neutral-800/80 px-4 py-3 sticky top-0 z-30 backdrop-blur-md no-print">
                        <div className="max-w-3xl mx-auto flex items-center justify-between">
                            <div onClick={() => setScreen('HOME')} className="flex items-center space-x-2 cursor-pointer group">
                                <div className="w-7 h-7 bg-orange-600 rounded-lg flex items-center justify-center text-white font-black text-xs shadow-md">C</div>
                                <span className="font-extrabold text-neutral-100 text-sm tracking-tight group-hover:text-orange-500 transition">Circuit Builder</span>
                            </div>
                            {screen === 'BUILDER' && (
                                <div className="flex items-center space-x-1.5">
                                    {stations.map((st, idx) => (
                                        <div key={st.id} onClick={() => setActiveStationIndex(idx)} className={`h-2 rounded-full cursor-pointer transition-all ${idx === activeStationIndex ? 'w-6 bg-orange-600' : 'w-2 bg-neutral-800'}`} />
                                    ))}
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="flex-grow px-4 py-6">
                        {screen === 'HOME' && renderHomeScreen()}
                        {screen === 'ROUNDS_SELECT' && renderRoundsScreen()}
                        {screen === 'BUILDER' && renderBuilderScreen()}
                        {screen === 'SUMMARY' && renderSummaryScreen()}
                        {screen === 'CELEBRATION' && renderCelebrationScreen()}
                    </main>

                    {renderModals()}

                    <footer className="py-4 border-t border-neutral-800/50 text-center text-xs text-neutral-500 no-print">
                        Circuit Builder Pro
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
